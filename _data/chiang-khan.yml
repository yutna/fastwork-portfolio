# Single content source for the เชียงคาน — ตื่นเช้าให้ทัน demo.
# Times, durations, and prices are sample values for the design demo.
# The browser shell reads the same object through a JSON script tag.

slots:
  - key: morning
    label: "เช้า"
  - key: late-morning
    label: "สาย"
  - key: afternoon
    label: "บ่าย"
  - key: evening
    label: "เย็น"

stops:
  - id: alms
    day: 1
    slot: morning
    time: "06:00"
    duration: 45
    travel: 0
    cost: 100
    title: "ใส่บาตรยามเช้า"
    short: "ใส่บาตร"
    illustration: "alms"
    blurb: "ข้าวเหนียวยังนึ่งอยู่ในหวด หมอกยังไม่ทันจาง และถนนชายโขงยังเงียบ"
    note: "ชุดใส่บาตรมีขายในตลาดเช้า ประมาณ 100 บาท แต่งกายสุภาพ"
  - id: street
    day: 1
    slot: morning
    time: "07:30"
    duration: 60
    travel: 5
    cost: 0
    title: "ถนนบ้านไม้เก่ายามเช้า"
    short: "บ้านไม้เก่า"
    illustration: "street"
    blurb: "บ้านไม้สองชั้นสีซีดเรียงรายตามริมโขง เงาเฉียง\u00A0ๆ ก่อนร้านจะเปิด"
    note: "ถนนคนเดินเปิดประมาณ 16:00–22:00 — ตอนเช้าเดินดูบ้านเก่าได้เงียบกว่า"
  - id: coffee
    day: 1
    slot: late-morning
    time: "09:00"
    duration: 45
    travel: 5
    cost: 80
    title: "กาแฟริมโขง"
    short: "กาแฟริมโขง"
    illustration: "coffee"
    blurb: "นั่งร้านเล็ก\u00A0ๆ หันหน้าออกแม่น้ำ เรือล่องผ่านเป็นครั้งคราว"
    note: "กาแฟแก้วละประมาณ 80 บาท ร้านส่วนใหญ่เปิดสาย"
  - id: temple
    day: 1
    slot: late-morning
    time: "10:30"
    duration: 45
    travel: 10
    cost: 20
    title: "วัดศรีคุณเมือง"
    short: "วัดศรีคุณเมือง"
    illustration: "temple"
    blurb: "หลังคาไม้เก่าและจิตรกรรมฝาผนังเล่าเรื่องชาดก วัดเก่าที่คนที่นี่ก็ยังมาใช้จริง"
    note: "แต่งกายสุภาพ งดเสียงดัง และสอบถามก่อนถ่ายภาพในเขตศาสนสถาน"
  - id: kaeng
    day: 2
    slot: morning
    time: "05:45"
    duration: 60
    travel: 30
    cost: 100
    title: "แก่งคุดคู้ยามพระอาทิตย์ขึ้น"
    short: "แก่งคุดคู้"
    illustration: "kaeng"
    blurb: "แก่งหินกลางโขงที่โผล่พ้นน้ำในหน้าแล้ง แสงแรกทอจากฝั่งตรงข้าม"
    note: "อยู่ห่างจากตัวเมืองประมาณ 5 กม. ควรจองรถหรือจักรยานไว้ล่วงหน้า"

day_notes:
  - day: 1
    slot: afternoon
    title: "พักผ่อนริมโขง"
    text: "นั่งใต้ต้นไม้หรือกลับที่พักก่อนออกไปเดินตลาดตอนเย็น"
  - day: 1
    slot: evening
    title: "ถนนคนเดิน"
    text: "ตลาดเปิดประมาณ 16:00–22:00 — ไม่นับเป็นหมุด แต่คุ้มที่จะเดิน"
