name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          if-no-files-found: error
  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Install dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Typecheck JavaScript
        run: npm run lint:js
      - name: Check the production artifact
        run: npm run check:static
      - name: Validate HTML
        run: npm run check:html
      - name: Unit tests
        run: npm run test:unit
      - name: Browser and accessibility tests
        run: npm run test:e2e
  # ci-ok is the one required check: add every job above to its needs.
  ci-ok:
    if: always()
    needs: [actionlint, build, test]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
