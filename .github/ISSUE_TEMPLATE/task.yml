name: Task
description: A focused change with clear acceptance criteria
labels: [chore]
assignees: [yutna]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that must pass.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files
      description: Paths or areas expected to change.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands or checks that prove the change works.
      placeholder: |
        mise exec -- npm run test:all
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this change must not do.
